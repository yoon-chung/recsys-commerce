# exp_000_als_baseline — implicit ALS baseline reproduction with self-val.
#
# Goal: produce reference NDCG@10 on the last-7-day hold-out, validate the
# core/ pipeline end-to-end on the real 8.35M-event / 638k-user data.
#
# Note: 1차 시도(2026-05-20 07:18 UTC, wandb run on yooni0125-)는 factors=128/
# reg=0.01/alpha=40/weights 1·3·5/filter_already_liked=True로 베이스라인과
# 다른 셋팅으로 돌려 self-val NDCG=0.0288이 나왔다. 베이스라인 공시 0.0847과
# 3x gap. 갭의 원인을 정확히 짚기 위해 이번 config은 베이스라인 train_als.py와
# 동일한 hyperparams + flags로 맞췄다 (use_gpu만 True 유지 — 동일 알고리즘).

# ---- Data paths (server canonical layout; override via CLI for testing) ---
train_data: /root/data/train.parquet
sample_submission: /root/data/sample_submission.csv

# ---- Validation split -----------------------------------------------------
val_days: 7                       # last 7 days mirror the official 1-week eval
gt_event_types: [purchase]        # competition metric is purchase-based

# ---- Implicit-feedback event weights -------------------------------------
# Baseline ALS treats every event row equally (label=1) and aggregates by
# (user, item) sum -> effectively "interaction count" per pair, with no
# event-type bias. EDA shows 99.78% of events are views, so summing counts
# already heavily weights repeat views.
event_weights:
  view: 1.0
  cart: 1.0
  purchase: 1.0

# ---- ALS hyperparameters (implicit.als.AlternatingLeastSquares) ----------
# All four numbers below match baseline_als.py exactly.
factors: 32
regularization: 0.001
iterations: 15
alpha: 10.0                       # confidence scaling: c_ui = 1 + alpha * r_ui
use_gpu: true                     # RTX 3090 24GB available on server
seed: 42

# ---- Prediction / submission ---------------------------------------------
top_n: 50                         # predictions.parquet ranks 1..top_n
items_per_user: 10                # submission.csv items per user
# Baseline keeps `filter_already_liked_items=False` -- crucial flag.
# Items the user already viewed/carted/purchased CAN be recommended again.
# This matches Feb-27~29 spike behavior where buys are heavily re-purchases
# of recently viewed items. The 1st attempt set this True and lost that signal.
filter_already_liked: false

# ---- wandb ---------------------------------------------------------------
# entity 명시 안 하면 계정 default team으로 라우팅됨 (이전 부트캠프 팀으로
# 잘못 갔던 사례 있음). 항상 명시하는 게 안전.
wandb_entity: yooni0125-
wandb_project: cy-commerce-recsys
run_name: exp_000_als_baseline
