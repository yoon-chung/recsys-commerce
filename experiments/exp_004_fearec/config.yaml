# exp_004_fearec -- FEARec (Du et al., SIGIR 2023).
#
# Frequency Enhanced + Auto-correlation sequential recommender. Decomposes
# the attention into frequency-domain spectrum modeling (FFT) AND learnable
# auto-correlation over time-lags. Different from BSARec (which uses an
# FFT-based hybrid attention but no auto-correlation) -- adds explicit
# repeat-purchase / periodic-interest modeling.
#
# Originally planned: TiSASRec. RecBole 1.2 does not export TiSASRec/CL4SRec
# in this build; FEARec is teammate's other ★★★ pick and IS in the build
# (recbole.model.sequential_recommender.FEARec). Same EDA fit angle:
# our data has high repeat-view rate (14.63%) + time-interval CV=4.12 ->
# auto-correlation is a strong inductive bias.
#
# Orthogonality vs siblings we already ran:
#   BSARec  : FFT hybrid attention (no auto-correlation)
#   FEARec  : FFT + auto-correlation matrix (this exp)

# ---- Data (same atomic as exp_002/exp_005) -------------------------------
data_path: ./data
dataset: cy_commerce
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp]
NEG_PREFIX: neg_

MAX_ITEM_LIST_LENGTH: 50

# ---- Model -- SASRec backbone -------------------------------------------
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
loss_type: CE

# ---- FEARec-specific (paper / RecBole defaults) -------------------------
# topk_factor   : K for auto-correlation top-K time-lag selection.
# global_ratio  : ratio of low-pass vs high-pass cut in the freq branch.
# tau / lmd     : InfoNCE temperature + weight (FEARec has a contrastive
#                 auxiliary loss on freq+time views).
# fredom        : enable frequency-domain regularisation (paper has this).
# fredom_type   : 'all' | 'us' | 'un'  (paper default 'us' = user-sequence).
topk_factor: 3
global_ratio: 0.5
tau: 1.0
lmd: 0.1
sim: dot
fredom: true
fredom_type: us

# ---- Training -----------------------------------------------------------
epochs: 200
train_batch_size: 2048
eval_batch_size: 2048
learning_rate: 0.002
stopping_step: 5
eval_step: 2
learner: adam
train_neg_sample_args: ~

# ---- RecBole eval (early stopping only) ---------------------------------
metrics: [NDCG, Recall, MRR, Hit]
topk: [10]
valid_metric: NDCG@10
eval_args:
  split:
    LS: valid_and_test
  group_by: user
  order: TO
  mode: full

# ---- Misc ---------------------------------------------------------------
seed: 42
reproducibility: true
device: cuda
gpu_id: 0
show_progress: true
checkpoint_dir: ./saved
save_dataset: false
log_wandb: false

# ---- Our own wandb ------------------------------------------------------
wandb_entity: yooni0125-
wandb_project: cy-commerce-recsys
run_name: exp_004_fearec

# ---- Self-val + inference -----------------------------------------------
train_data: /root/data/train.parquet
sample_submission: /root/data/sample_submission.csv
val_days: 7
gt_event_types: [purchase]
ease_saved: ../exp_001_ease/saved
top_n: 50
items_per_user: 10
inference_batch_size: 2048
