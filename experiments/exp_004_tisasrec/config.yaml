# exp_004_tisasrec -- TiSASRec (Li et al., WSDM 2020).
#
# Time Interval aware Self-Attention. Encodes pairwise time gaps between
# items in the user's sequence as an extra attention bias matrix. Directly
# motivated by our EDA's time-gap CV = 4.12 (huge variance in inter-event
# intervals -- some seconds, some weeks). BSARec models periodicity via
# FFT; TiSASRec models absolute gap magnitudes. The two are orthogonal.
#
# RecBole has TiSASRec built-in -- no model port required.

# ---- Data (reuse exp_002 atomic conventions) -----------------------------
data_path: ./data
dataset: cy_commerce
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp]
NEG_PREFIX: neg_

# Max sequence length (per EDA p90 = 29; 50 follows SASRec default).
MAX_ITEM_LIST_LENGTH: 50

# ---- Model -- SASRec-identical backbone, with time gap matrix added ------
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
loss_type: CE

# ---- TiSASRec-specific ---------------------------------------------------
# TIME_SPAN: max time gap encoded; gaps larger than this are clamped.
# Units = days. Our data spans ~120 days, but per-user sequences within
# max_seq_length=50 typically span <30 days. 64 is a safe upper bound that
# also keeps the gap embedding table small (2 * TIME_SPAN + 1 rows).
TIME_SPAN: 64

# ---- Training ------------------------------------------------------------
epochs: 200
train_batch_size: 2048   # match BSARec for fair comparison
eval_batch_size: 2048
learning_rate: 0.002     # sqrt-scaled for batch=2048 (matches exp_002 fix)
stopping_step: 5
eval_step: 2
learner: adam
train_neg_sample_args: ~

# ---- RecBole eval (early stopping only) ----------------------------------
metrics: [NDCG, Recall, MRR, Hit]
topk: [10]
valid_metric: NDCG@10
eval_args:
  split:
    LS: valid_and_test
  group_by: user
  order: TO
  mode: full

# ---- Misc ----------------------------------------------------------------
seed: 42
reproducibility: true
device: cuda
gpu_id: 0
show_progress: true
checkpoint_dir: ./saved
save_dataset: false
log_wandb: false

# ---- Our own wandb (read by train.py) ------------------------------------
wandb_entity: yooni0125-
wandb_project: cy-commerce-recsys
run_name: exp_004_tisasrec

# ---- Self-val + inference (read by inference.py) -------------------------
train_data: /root/data/train.parquet
sample_submission: /root/data/sample_submission.csv
val_days: 7
gt_event_types: [purchase]
ease_saved: ../exp_001_ease/saved
top_n: 50
items_per_user: 10
inference_batch_size: 2048
