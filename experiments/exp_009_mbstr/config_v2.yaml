# exp_009_mbstr / config_v2 -- larger capacity to match teammate's MBSTR.
#
# v1 (config.yaml) self-val 0.2389 -- hidden=64, n_layers=2, n_heads=2, inner=256
# 팀원 share: hidden=256, n_layers=3, n_heads=4, inner=512, batch=4096
# capacity 4-8배 큼. v1 underfit 가설.
#
# v2 = 팀원 설정 그대로 (behavior id encoding 만 우리 v1 매핑 유지: PAD=0/view=1/cart=2/purchase=3)

# ---- Data ---------------------------------------------------------------
data_path: ./data
dataset: cy_commerce_mb        # v1 과 동일 dataset (atomic files 재사용)
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp, behavior_id]
NEG_PREFIX: neg_

MAX_ITEM_LIST_LENGTH: 50

# ---- Model -- larger SASRec/BSARec backbone (팀원 setting) -------------
n_layers: 3
n_heads: 4
hidden_size: 256
inner_size: 512
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
loss_type: CE

# ---- BSARec FFT (exp_002 winner, kept from v1) -------------------------
alpha: 0.7
c: 5

# ---- MB-STR specific ---------------------------------------------------
n_behaviors: 4                 # 0=PAD, 1=view, 2=cart, 3=purchase

# ---- Training ----------------------------------------------------------
epochs: 200
train_batch_size: 4096
eval_batch_size: 4096
learning_rate: 0.002
stopping_step: 5
eval_step: 2
learner: adam
train_neg_sample_args: ~

# ---- RecBole eval (early stopping only) --------------------------------
metrics: [NDCG, Recall, MRR, Hit]
topk: [10]
valid_metric: NDCG@10
eval_args:
  split:
    LS: valid_and_test
  group_by: user
  order: TO
  mode: full

# ---- Misc --------------------------------------------------------------
seed: 42
reproducibility: true
device: cuda
gpu_id: 0
show_progress: true
checkpoint_dir: ./saved_v2
save_dataset: false
log_wandb: false

# ---- Our own wandb -----------------------------------------------------
wandb_entity: yooni0125-
wandb_project: cy-commerce-recsys
run_name: exp_009b_mbstr_v2

# ---- Self-val + inference ----------------------------------------------
train_data: /root/data/train.parquet
sample_submission: /root/data/sample_submission.csv
val_days: 7
gt_event_types: [purchase]
ease_saved: ../exp_001_ease/saved
top_n: 50
items_per_user: 10
inference_batch_size: 1024     # hidden 256 -> 메모리 더 큼, batch 줄임
