# exp_009_mbstr / config_v2b -- v2 plateau 진단 후 LR + dropout 동시 완화
#
# v2 결과: epoch 31, best valid_score=0.2538 (v1 0.2646 < v2 0.2538 → 큰 모델인데 underperform)
# 진단: hidden 256 (v1 의 16배 capacity) 인데 LR=0.002, dropout=0.5/0.5 그대로 사용
#       → train loss 매우 천천히 감소 + valid plateau → local optimum 못 벗어남
#
# v2b 조정:
#   learning_rate: 0.002 -> 0.001   (큰 모델 finer convergence)
#   hidden_dropout: 0.5 -> 0.3      (큰 capacity 활용)
#   attn_dropout: 0.5 -> 0.3        (큰 capacity 활용)
# 나머지 hyperparameter 는 v2 와 동일 (팀원 setting + behavior id v1 mapping)

# ---- Data ---------------------------------------------------------------
data_path: ./data
dataset: cy_commerce_mb
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp, behavior_id]
NEG_PREFIX: neg_

MAX_ITEM_LIST_LENGTH: 50

# ---- Model -- v2 와 동일 capacity --------------------------------------
n_layers: 3
n_heads: 4
hidden_size: 256
inner_size: 512
hidden_dropout_prob: 0.3        # v2: 0.5
attn_dropout_prob: 0.3          # v2: 0.5
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
loss_type: CE

# ---- BSARec FFT (exp_002 winner, kept) ---------------------------------
alpha: 0.7
c: 5

# ---- MB-STR specific ---------------------------------------------------
n_behaviors: 4                 # 0=PAD, 1=view, 2=cart, 3=purchase

# ---- Training ----------------------------------------------------------
epochs: 200
train_batch_size: 4096
eval_batch_size: 4096
learning_rate: 0.001            # v2: 0.002
stopping_step: 5
eval_step: 2
learner: adam
train_neg_sample_args: ~

# ---- RecBole eval (early stopping only) --------------------------------
metrics: [NDCG, Recall, MRR, Hit]
topk: [10]
valid_metric: NDCG@10
eval_args:
  split:
    LS: valid_and_test
  group_by: user
  order: TO
  mode: full

# ---- Misc --------------------------------------------------------------
seed: 42
reproducibility: true
device: cuda
gpu_id: 0
show_progress: true
checkpoint_dir: ./saved_v2b
save_dataset: false
log_wandb: false

# ---- Our own wandb -----------------------------------------------------
wandb_entity: yooni0125-
wandb_project: cy-commerce-recsys
run_name: exp_009b_mbstr_v2b

# ---- Self-val + inference ----------------------------------------------
train_data: /root/data/train.parquet
sample_submission: /root/data/sample_submission.csv
val_days: 7
gt_event_types: [purchase]
ease_saved: ../exp_001_ease/saved
top_n: 50
items_per_user: 10
inference_batch_size: 1024
