# exp_005_bert4rec -- BERT4Rec (Sun et al., CIKM 2019).
#
# Bidirectional self-attention for sequential recommendation. Trained via
# Masked Item Modeling (Cloze task) similar to BERT. Predicts each masked
# item using both past AND future items in the sequence -- structurally
# distinct from causal/left-to-right sequential models (BSARec, FEARec,
# SASRec). Strong industrial baseline still used in many production stacks.
#
# Originally planned: CL4SRec. RecBole 1.2 doesn't export CL4SRec. Choosing
# BERT4Rec over S3Rec (also available) because (a) S3Rec needs two-stage
# pretrain+finetune which complicates a one-day scaffold, and (b) BERT4Rec
# adds genuinely orthogonal mechanism (bidirectional) to our ensemble vs
# more causal variants. Sparse-data benefit comes from Cloze masking
# providing dense self-supervision signal per sequence.
#
# Mechanism orthogonality vs siblings already trained:
#   BSARec       : causal + FFT hybrid attention
#   FEARec       : causal + FFT + auto-correlation
#   BERT4Rec     : bidirectional + masked item modeling (this exp)

# ---- Data (same atomic as exp_002 / exp_004) -----------------------------
data_path: ./data
dataset: cy_commerce
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp]
NEG_PREFIX: neg_

MAX_ITEM_LIST_LENGTH: 50

# ---- Model -- transformer encoder, bidirectional ------------------------
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
loss_type: CE

# ---- BERT4Rec-specific --------------------------------------------------
# mask_ratio: fraction of items masked per training step (paper default 0.2).
# Higher mask_ratio gives denser supervision per sequence but harder task.
mask_ratio: 0.2

# ---- Training -----------------------------------------------------------
epochs: 200
train_batch_size: 2048
eval_batch_size: 2048
learning_rate: 0.002
stopping_step: 5
eval_step: 2
learner: adam
train_neg_sample_args: ~

# ---- RecBole eval (early stopping only) ---------------------------------
metrics: [NDCG, Recall, MRR, Hit]
topk: [10]
valid_metric: NDCG@10
eval_args:
  split:
    LS: valid_and_test
  group_by: user
  order: TO
  mode: full

# ---- Misc ---------------------------------------------------------------
seed: 42
reproducibility: true
device: cuda
gpu_id: 0
show_progress: true
checkpoint_dir: ./saved
save_dataset: false
log_wandb: false

# ---- Our own wandb ------------------------------------------------------
wandb_entity: yooni0125-
wandb_project: cy-commerce-recsys
run_name: exp_005_bert4rec

# ---- Self-val + inference -----------------------------------------------
train_data: /root/data/train.parquet
sample_submission: /root/data/sample_submission.csv
val_days: 7
gt_event_types: [purchase]
ease_saved: ../exp_001_ease/saved
top_n: 50
items_per_user: 10
inference_batch_size: 2048
