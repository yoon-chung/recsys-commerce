# exp_002d_bsarec_1w -- BSARec recency-window ablation (last 1 week)
#
# Identical model + hyperparameters to exp_002_bsarec / exp_002b / exp_002c.
# Only training data differs: last 1 week (Feb 16-22, before fixed Feb 23-29
# val). Extreme recency. Expect heavy cold-start blowup (most users no seq).
#
# Hypothesis: short recency window helps sequential models (recency bias on
# user intent) on the ACTIVE-user subset (~30-50% of 638k), at the cost of
# cold-start blowup for the rest. Net effect on full 638k NDCG is unclear;
# see README.md for full reasoning.

# ---- Data (RecBole atomic-file conventions) ------------------------------
# We build our own atomic dataset via data_prep.py:
#   data_prep.py -> ./data/cy_commerce/cy_commerce.inter
# This is independent of the baseline-provided /root/code/ preprocessing
# (CLAUDE.md: do not copy baseline). The .inter file is gitignored.
data_path: ./data
dataset: cy_commerce_1w
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp]
NEG_PREFIX: neg_

# Max length of input sequence (per EDA p90 = 29; 50 is the SASRec default).
MAX_ITEM_LIST_LENGTH: 50

# ---- Model -- SASRec-identical block --------------------------------------
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
loss_type: CE

# ---- BSARec-specific ------------------------------------------------------
# alpha: weight on frequency component (1 - alpha for attention).
#   Paper Beauty: 0.7. For short-noisy sequences (commerce view-dominated),
#   higher alpha (more smoothing) tends to help. Tune in [0.5, 0.9].
alpha: 0.7
# c: low-pass cutoff (smaller -> stronger smoothing). Paper sweeps 1-9.
#   Default 5 ~ 1/5 of max_seq_length 50.
c: 5

# ---- Training -------------------------------------------------------------
epochs: 200
# batch=2048 chosen after observing 0.46 / 23.7 GB GPU usage at batch=256.
# RTX 3090 24GB has comfortable headroom for >=2048. Throughput scales
# roughly 3-4x (compute-bound) at this size.
train_batch_size: 2048
eval_batch_size: 2048
# LR scaled by sqrt(batch_ratio) = sqrt(8) ~= 2.83. We use 2x (conservative)
# to reduce divergence risk; if epoch 1-2 loss looks fine we could push higher
# in a follow-up ablation.
learning_rate: 0.002
stopping_step: 5               # halved from exp_002 (10) since eval_step doubles -> same eval count
eval_step: 2                   # eval every 2 epochs (4w wall time per epoch is short; lighter eval overhead)
learner: adam
train_neg_sample_args: ~        # CE loss doesn't need negative sampling

# ---- RecBole eval (for early stopping only) ------------------------------
# NOTE: Our official self-val (NDCG@10 on last-7-day purchases) is computed
# outside RecBole in inference.py, mirroring exp_000/001. RecBole's eval below
# is just to drive early stopping during training.
metrics: [NDCG, Recall, MRR, Hit]
topk: [10]
valid_metric: NDCG@10
eval_args:
  split:
    LS: valid_and_test          # leave-one-out (last item -> test, second-last -> val)
  group_by: user
  order: TO                     # time-ordered split per user
  mode: full                    # full-ranking eval (vs full item catalog)

# ---- Misc -----------------------------------------------------------------
seed: 42
reproducibility: true
device: cuda
gpu_id: 0
show_progress: true
checkpoint_dir: ./saved
save_dataset: false
log_wandb: false                # we drive wandb from train.py for consistency

# ---- Our own wandb config (read by train.py) -----------------------------
wandb_entity: yooni0125-
wandb_project: cy-commerce-recsys
run_name: exp_002d_bsarec_1w

# ---- Our own self-val + inference (read by inference.py) -----------------
train_data: /root/data/train.parquet
sample_submission: /root/data/sample_submission.csv
val_days: 7
gt_event_types: [purchase]
ease_saved: ../exp_001_ease/saved   # for val_gt.parquet + eval_users.json reuse
top_n: 50
items_per_user: 10
inference_batch_size: 4096   # 1024 -> 4096 (RTX 3090 24GB has headroom; 4w inference ~50% faster)
